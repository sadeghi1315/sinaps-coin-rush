<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050b22">
<title>SINAPS COIN RUSH</title>
<style>
:root{--cyan:#00d9ff;--blue:#167cff;--purple:#8c35ff;--gold:#ffd34e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040817;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}body{touch-action:none}.game{position:relative;width:100%;height:100%;max-width:520px;margin:auto;background:radial-gradient(ellipse at 50% 25%,#172c69 0,#080f2d 48%,#030611 100%);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}.pill{background:#07162be8;border:1px solid #1c9eff8c;border-radius:14px;padding:8px 12px;box-shadow:0 0 16px #008cff26;font-weight:800;font-size:13px}.pill span{color:var(--gold)}.brand{position:absolute;top:12%;width:100%;text-align:center;z-index:2;pointer-events:none;text-shadow:0 0 18px #00cfff}.brand .s{font-size:42px;color:#00d9ff;font-weight:1000;font-style:italic;line-height:1}.brand h1{font-size:27px;letter-spacing:5px;margin:4px 0 0}.brand p{margin:3px 0;color:#8cecff;letter-spacing:3px;font-size:12px}.panel{position:absolute;z-index:4;left:7%;right:7%;top:50%;transform:translateY(-40%);border:1px solid #00cfff9c;background:linear-gradient(145deg,#071934ee,#090a28f5);border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 0 35px #006dff36}.panel h2{color:#31e5ff;margin:0 0 8px;font-size:26px;letter-spacing:1px}.panel p{color:#b7d8ff;font-size:14px;line-height:1.5}.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 14px;margin-top:12px;font-weight:900;color:#fff;letter-spacing:1px;background:linear-gradient(100deg,#00cfff,#176dff 55%,#9b31ff);box-shadow:0 0 22px #168cff55;font-size:15px}.btn.secondary{background:#07172c;border:1px solid #00d9ff;color:#aeeeff;box-shadow:none}.hidden{display:none!important}.bottomhint{position:absolute;bottom:24px;width:100%;text-align:center;color:#9dbdff;font-size:12px;z-index:2;pointer-events:none}.touch-controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:3;pointer-events:none}.touch-controls button{pointer-events:auto;width:64px;height:54px;border-radius:16px;border:1px solid #21dfff88;background:#07182bbd;color:#d9fbff;font-size:22px;font-weight:900}.toast{position:absolute;z-index:5;top:23%;width:100%;text-align:center;color:#ffe66a;font-weight:900;text-shadow:0 0 15px #ffb000;pointer-events:none}.footer{font-size:10px;color:#6e94c7;margin-top:14px}
</style></head>
<body><main class="game" id="game"><canvas id="c"></canvas>
<div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">0</span></div><div class="pill">BEST <span id="best">0</span></div></div>
<div class="brand" id="brand"><div class="s">S</div><h1>SINAPS</h1><p>COIN RUSH</p></div>
<section class="panel" id="start"><h2>COIN RUSH</h2><p>Run through the neon city.<br>Collect SINAPS coins and dodge obstacles!</p><button class="btn" id="startBtn">▶ START GAME</button><p class="footer">Swipe ◀ ▶ to move · Swipe ↑ to jump · Swipe ↓ to slide</p></section>
<section class="panel hidden" id="over"><h2>RUN COMPLETE</h2><p id="summary">Score 0</p><button class="btn" id="againBtn">↻ RUN AGAIN</button><button class="btn secondary" id="homeBtn">MAIN MENU</button></section>
<div class="toast" id="toast"></div><div class="bottomhint" id="hint">SWIPE TO MOVE · COLLECT THE GLOWING COINS</div>
<div class="touch-controls hidden" id="controls"><button id="left">◀</button><button id="jump">⬆</button><button id="slide">⬇</button><button id="right">▶</button></div></main>
<script>
(()=>{'use strict';
// Compatibility fix for older Android / Telegram WebViews without Canvas roundRect.
if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) { CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ r=Math.max(0,Math.min(Number(r)||0,Math.abs(w)/2,Math.abs(h)/2)); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; }; }
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
if (!ctx) { document.body.innerHTML='<div style="padding:24px;color:white;background:#040817;font:18px Arial">This browser does not support the game. Open this link in Chrome.</div>'; return; }let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let running=false,over=false,lane=0,coins=0,score=0,best=+(localStorage.sinapsRushBest||0),distance=0,speed=0.34,spawn=0,objects=[],stars=[],last=0,jumpT=0,slideT=0,shake=0; $('best').textContent=best;
for(let i=0;i<75;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.7+.3,a:Math.random()*.7+.2});
function reset(){lane=0;coins=0;score=0;distance=0;speed=.34;spawn=0;objects=[];jumpT=slideT=shake=0;running=true;over=false;$('start').classList.add('hidden');$('over').classList.add('hidden');$('controls').classList.remove('hidden');$('brand').classList.add('hidden');$('hint').classList.remove('hidden');$('toast').textContent='';last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;over=true;$('controls').classList.add('hidden');$('over').classList.remove('hidden');$('summary').innerHTML=`SCORE <b>${score.toLocaleString()}</b><br>COINS COLLECTED <b style="color:#ffd34e">${coins}</b><br>DISTANCE <b>${Math.floor(distance)} m</b>`;if(score>best){best=score;localStorage.sinapsRushBest=best}$('best').textContent=best;$('hint').classList.add('hidden')}
function act(a){if(!running)return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&jumpT<=0)jumpT=0.78;if(a==='slide'&&slideT<=0)slideT=.65}
$('startBtn').onclick=reset;$('againBtn').onclick=reset;$('homeBtn').onclick=()=>{ $('over').classList.add('hidden');$('start').classList.remove('hidden');$('brand').classList.remove('hidden');$('hint').classList.remove('hidden')};['left','right','jump','slide'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();act(id)}));
let sx=0,sy=0;game.addEventListener('touchstart',e=>{if(!running)return;sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});game.addEventListener('touchend',e=>{if(!running)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;if(Math.abs(dx)>Math.abs(dy))act(dx<0?'left':'right');else act(dy<0?'jump':'slide')},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')act('left');if(e.key==='ArrowRight'||e.key==='d')act('right');if(e.key==='ArrowUp'||e.key===' ')act('jump');if(e.key==='ArrowDown'||e.key==='s')act('slide')});
function project(l,z){let t=1-z;let horizon=H*.29;let y=horizon+Math.pow(t,1.65)*(H*.77);let spread=(W*.055+Math.pow(t,1.1)*W*.40);return{x:W/2+l*spread*.62,y,scale:.12+t*1.1,spread}}
function spawnObj(){let lanePick=Math.floor(Math.random()*3)-1;let type=Math.random()<.67?'coin':(Math.random()<.55?'block':'barrier');if(type==='coin'){for(let j=0;j<4;j++)objects.push({lane:lanePick,z:1-j*.075,type:'coin',hit:false})}else objects.push({lane:lanePick,z:1,type,hit:false})}
function drawCity(now){let horizon=H*.29;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#071b50');sky.addColorStop(.45,'#11104a');sky.addColorStop(1,'#030716');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.globalAlpha=s.a*(.75+.25*Math.sin(now*.001+s.x*8));ctx.fillStyle='#b7efff';ctx.beginPath();ctx.arc(s.x*W,s.y*horizon,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
// skyline
for(let side of [-1,1])for(let i=0;i<9;i++){let bw=W*(.035+((i*13)%7)*.009),bh=H*(.08+((i*7)%9)*.025),x=side<0?i*W*.055:W-i*W*.055-bw,y=horizon-bh;ctx.fillStyle=i%2?'#101c58':'#15154c';ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#00cfff';for(let wy=y+8;wy<horizon-4;wy+=12)for(let wx=x+5;wx<x+bw-3;wx+=9){ctx.globalAlpha=.25+Math.random()*.35;ctx.fillRect(wx,wy,2,4)}ctx.globalAlpha=1}
// road perspective
ctx.fillStyle='#080e29';ctx.beginPath();ctx.moveTo(W*.43,horizon);ctx.lineTo(W*.57,horizon);ctx.lineTo(W*1.08,H);ctx.lineTo(-W*.08,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#0bdcff';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor='#00cfff';ctx.beginPath();ctx.moveTo(W*.43,horizon);ctx.lineTo(-W*.08,H);ctx.moveTo(W*.57,horizon);ctx.lineTo(W*1.08,H);ctx.stroke();ctx.shadowBlur=0;
// lane lines moving
for(let i=0;i<18;i++){let z=((i/18+distance*.006)%1),t=1-z,y=horizon+Math.pow(t,1.65)*(H*.77),spread=(W*.055+Math.pow(t,1.1)*W*.40);ctx.strokeStyle=`rgba(25,134,255,${.12+t*.4})`;ctx.lineWidth=1+t*2;ctx.beginPath();ctx.moveTo(W/2-spread/3,y);ctx.lineTo(W/2-spread/3,y+2+t*18);ctx.moveTo(W/2+spread/3,y);ctx.lineTo(W/2+spread/3,y+2+t*18);ctx.stroke()}}
function drawCoin(x,y,s,now){ctx.save();ctx.translate(x,y);ctx.scale(.65+Math.abs(Math.sin(now*.008))*0.35,1);ctx.shadowColor='#ffca35';ctx.shadowBlur=18*s;let g=ctx.createRadialGradient(-s*.2,-s*.2,1,0,0,s);g.addColorStop(0,'#fff8b0');g.addColorStop(.4,'#ffce39');g.addColorStop(1,'#ff8b16');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();ctx.lineWidth=Math.max(1,s*.12);ctx.strokeStyle='#fff0a1';ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#8e4d00';ctx.font=`900 ${Math.max(7,s*1.05)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S',0,1);ctx.restore()}
function drawPlayer(now){let p=project(lane,0),x=p.x,y=H*.82-(jumpT>0?Math.sin((.78-jumpT)/.78*Math.PI)*H*.16:0);let s=Math.min(W,H)*.075;ctx.save();ctx.translate(x,y);if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.shadowColor='#00cfff';ctx.shadowBlur=22; // legs
ctx.strokeStyle='#1edcff';ctx.lineWidth=s*.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*.18,s*.35);ctx.lineTo(-s*.25,s*.75);ctx.moveTo(s*.18,s*.35);ctx.lineTo(s*.28,s*.72);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#101c4d';ctx.strokeStyle='#38dfff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-s*.34,-s*.2,s*.68,s*.68,s*.18);ctx.fill();ctx.stroke();ctx.fillStyle='#071329';ctx.beginPath();ctx.arc(0,-s*.38,s*.29,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#00eaff';ctx.stroke();ctx.fillStyle='#00dfff';ctx.font=`900 ${s*.32}px Arial`;ctx.textAlign='center';ctx.fillText('S',0,s*.17);ctx.restore()}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;distance+=dt*(18+speed*22);speed=Math.min(.75,speed+dt*.003);score=Math.floor(distance*2+coins*25);spawn-=dt;if(spawn<=0){spawnObj();spawn=.65+Math.random()*.5-speed*.3}jumpT=Math.max(0,jumpT-dt);slideT=Math.max(0,slideT-dt);shake=Math.max(0,shake-dt*20);objects.forEach(o=>o.z-=dt*speed*.72);
drawCity(now);objects.sort((a,b)=>b.z-a.z);for(let o of objects){if(o.z<0||o.z>1)continue;let p=project(o.lane,o.z),s=20*p.scale;if(o.type==='coin'){drawCoin(p.x,p.y-s*.3,s*.65,now);if(o.z<.075&&!o.hit&&o.lane===lane){o.hit=true;coins++;$('coins').textContent=coins;$('toast').textContent='+1 SINAPS COIN';setTimeout(()=>{if($('toast').textContent==='+1 SINAPS COIN')$('toast').textContent=''},500)}}else{ctx.save();ctx.translate(p.x,p.y);if(o.type==='block'){ctx.shadowColor='#ff3b8c';ctx.shadowBlur=14;ctx.fillStyle='#b91f65';ctx.strokeStyle='#ff6cbd';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-s*.9,-s*1.2,s*1.8,s*1.2,5);ctx.fill();ctx.stroke();ctx.fillStyle='#ffbadb';ctx.fillRect(-s*.55,-s*.9,s*1.1,s*.12)}else{ctx.fillStyle='#f7a12d';ctx.strokeStyle='#ffe17d';ctx.lineWidth=3;ctx.fillRect(-s*1.2,-s*.6,s*2.4,s*.45);ctx.strokeRect(-s*1.2,-s*.6,s*2.4,s*.45)}ctx.restore();if(o.z<.07&&!o.hit&&o.lane===lane){o.hit=true;if((o.type==='block'&&jumpT<=.08)||(o.type==='barrier'&&slideT<=.08)){shake=10;end();break}}}}
objects=objects.filter(o=>o.z>-.08&&!(o.hit&&o.type==='coin'));drawPlayer(now);$('score').textContent=score.toLocaleString();$('coins').textContent=coins;requestAnimationFrame(loop)}
// preview animation on title screen
let previewStart=performance.now();function preview(now){if(running)return;drawCity(now);let p=project(0,0);drawPlayer(now);requestAnimationFrame(preview)}requestAnimationFrame(preview);
})();
</script></body></html>
