<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050b25"><title>SINAPS COIN RUSH 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030718;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}#ui{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;gap:8px}.brand{font-weight:1000;letter-spacing:2px;font-size:clamp(15px,4vw,23px);text-shadow:0 0 18px #00baff}.brand small{display:block;font-size:10px;color:#66eaff;letter-spacing:4px}.hud{display:flex;gap:7px}.pill{background:#061533cc;border:1px solid #1bbaff88;border-radius:12px;padding:7px 10px;box-shadow:0 0 16px #008cff22;min-width:70px;text-align:center}.pill span{display:block;color:#8befff;font-size:9px;letter-spacing:1px}.pill b{font-size:16px;color:#fff}.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(88vw,420px);text-align:center;pointer-events:auto;background:linear-gradient(145deg,#07132de8,#130c36e8);border:1px solid #28c9ff99;border-radius:25px;padding:26px 22px;box-shadow:0 0 45px #007bff40,inset 0 0 25px #1a83ff15;backdrop-filter:blur(8px)}.logo{font-size:clamp(32px,9vw,52px);font-weight:1000;letter-spacing:3px;background:linear-gradient(#fff,#50e8ff 55%,#247aff);color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 0 32px #00c8ff33}.sub{color:#8ceaff;letter-spacing:4px;font-size:11px;font-weight:800}.desc{color:#c5d7ff;font-size:13px;line-height:1.6;margin:16px 0 20px}.btn{border:0;border-radius:14px;padding:14px 20px;width:100%;color:#031126;font-weight:1000;font-size:16px;letter-spacing:1px;background:linear-gradient(100deg,#27eaff,#1685ff);box-shadow:0 0 24px #00bfff77;pointer-events:auto}.btn:active{transform:scale(.98)}.hint{font-size:10px;color:#91a9db;margin-top:13px}.hide{display:none!important}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;color:#a8d8ff;font-size:11px;letter-spacing:1px;text-shadow:0 0 12px #00baff}.pause{pointer-events:auto;border:1px solid #30cfff99;background:#071a39dd;color:#fff;border-radius:12px;width:42px;height:42px;font-size:18px}.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-weight:1000;color:#fff;text-shadow:0 0 15px #00cfff;opacity:0;transition:opacity .15s}.toast.show{opacity:1}
</style></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="brand">SINAPS<small>COIN RUSH · 3D</small></div><div class="hud"><div class="pill"><span>SCORE</span><b id="score">0</b></div><div class="pill"><span>COINS</span><b id="coins">0</b></div><button id="pause" class="pause hide">Ⅱ</button></div></div><div id="menu" class="center"><div class="logo">SINAPS</div><div class="sub">COIN RUSH</div><p class="desc">RUN THROUGH THE GALAXY<br>COLLECT GLOWING S-COINS · DODGE ENERGY BLOCKS</p><button id="start" class="btn">▶ START RUN</button><div class="hint">SWIPE LEFT / RIGHT TO MOVE · SWIPE UP TO JUMP</div></div><div id="over" class="center hide"><div class="logo">RUN OVER</div><div class="sub">THE GALAXY AWAITS</div><p class="desc" id="result">SCORE 0</p><button id="again" class="btn">↻ RUN AGAIN</button><div class="hint">YOUR BEST SCORE IS SAVED ON THIS DEVICE</div></div><div id="toast" class="toast">+1 S-COIN</div><div class="bottom" id="bottom">TAP TO START YOUR JOURNEY</div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1,run=false,paused=false,score=0,coins=0,best=+(localStorage.getItem('sinaps3d_best')||0),lane=0,targetLane=0,playerY=0,vy=0,speed=.32,world=0,last=0,spawn=0,items=[],particles=[],stars=[],shake=0,toastTimer=0;const $=id=>document.getElementById(id);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H*.7,z:Math.random(),s:Math.random()*1.7+.3}))}addEventListener('resize',resize);resize();
function project(x,z,y=0){let horizon=H*.30,depth=Math.max(.02,1-z),scale=.22+depth*1.25;return {x:W/2+x*(W*.19)*scale,y:horizon+depth*(H*.72)-y*scale*100,scale}}function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke()}}function glowCircle(x,y,r,color,blur=20){ctx.save();ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function background(dt){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030719');g.addColorStop(.45,'#10144a');g.addColorStop(1,'#04091c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let rg=ctx.createRadialGradient(W*.72,H*.23,2,W*.72,H*.23,H*.45);rg.addColorStop(0,'#276bdb99');rg.addColorStop(.35,'#5425a944');rg.addColorStop(1,'#02071800');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);stars.forEach(s=>{s.y+=dt*(8+s.z*30)*(run&&!paused?1:0.2);if(s.y>H*.72){s.y=0;s.x=Math.random()*W}ctx.globalAlpha=.25+s.z*.65;glowCircle(s.x,s.y,s.s,'#83ddff',s.s*5)});ctx.globalAlpha=1; // distant planet
ctx.save();ctx.shadowColor='#298dff';ctx.shadowBlur=35;let px=W*.77,py=H*.22,pr=Math.min(W,H)*.12;let pg=ctx.createRadialGradient(px-pr*.3,py-pr*.4,1,px,py,pr);pg.addColorStop(0,'#85edff');pg.addColorStop(.28,'#2768d9');pg.addColorStop(.75,'#17205f');pg.addColorStop(1,'#080d2b');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();ctx.restore();}
function track(){let hz=H*.30,bottom=H*1.12;poly([{x:W*.5,y:hz},{x:W*.05,y:bottom},{x:W*.95,y:bottom}], '#101a43','#2375ff');poly([{x:W*.5,y:hz},{x:W*.12,y:bottom},{x:W*.88,y:bottom}], '#0a1433','#00dfff');for(let i=0;i<22;i++){let z=((i/22+world*1.6)%1),p=project(0,z),w=(W*.47)*(1-z)+2;ctx.strokeStyle=`rgba(30,190,255,${.12+(1-z)*.45})`;ctx.lineWidth=1+(1-z)*2;ctx.beginPath();ctx.moveTo(W/2-w,p.y);ctx.lineTo(W/2+w,p.y);ctx.stroke()}for(let side of [-1,1]){for(let i=0;i<3;i++){let z=((i/3+world*.7)%1),p=project(side*1.02,z);glowCircle(p.x,p.y,2+(1-z)*4,'#00d9ff',10)}}for(let l of [-.5,.5]){let a=project(l,0),b=project(l,1);ctx.strokeStyle='#22caff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
function coin(x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='#ffc83d';ctx.shadowBlur=r*1.4;let grad=ctx.createLinearGradient(-r,-r,r,r);grad.addColorStop(0,'#fff5a1');grad.addColorStop(.3,'#ffb51c');grad.addColorStop(.55,'#fff1a0');grad.addColorStop(1,'#d87500');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,r*Math.max(.2,Math.abs(Math.cos(rot))),r,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff2a0';ctx.lineWidth=Math.max(1,r*.09);ctx.stroke();ctx.fillStyle='#087fff';ctx.font=`900 ${r*1.15}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S',0,1);ctx.restore()}
function obstacle(it,p){let s=34*p.scale+4,top=p.y-s*1.4;ctx.save();ctx.shadowColor='#ff2e75';ctx.shadowBlur=20*p.scale;poly([{x:p.x-s*.6,y:p.y},{x:p.x+s*.55,y:p.y},{x:p.x+s*.55,y:top},{x:p.x-s*.6,y:top}], '#3d174a','#ff3d79');poly([{x:p.x-s*.6,y:top},{x:p.x-s*.25,y:top-s*.25},{x:p.x+s*.9,y:top-s*.25},{x:p.x+s*.55,y:top}], '#9b285f','#ff76b0');poly([{x:p.x+s*.55,y:p.y},{x:p.x+s*.9,y:p.y-s*.25},{x:p.x+s*.9,y:top-s*.25},{x:p.x+s*.55,y:top}], '#56174c','#ff3d79');ctx.restore()}
function spawnItem(){let ln=[-1,0,1][Math.floor(Math.random()*3)],kind=Math.random()<.77?'coin':'block';items.push({lane:ln,z:1.08,kind,rot:Math.random()*6.28,done:false});if(kind==='coin'&&Math.random()<.45){for(let i=1;i<4;i++)items.push({lane:ln,z:1.08+i*.075,kind:'coin',rot:Math.random()*6.28,done:false})}}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=50+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.6,max:.9,size:2+Math.random()*4,color})}}
function player(){let p=project(lane*.5,0,playerY),x=p.x,y=H*.79-playerY*45,scale=Math.min(W,H)/500;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#00cfff';ctx.shadowBlur=20; // jet trail
let tg=ctx.createLinearGradient(0,0,0,95);tg.addColorStop(0,'#8cfaffcc');tg.addColorStop(1,'#0088ff00');poly([{x:-10,y:15},{x:-4,y:15},{x:-17,y:95},{x:-25,y:72}],tg);poly([{x:5,y:15},{x:11,y:15},{x:27,y:82},{x:14,y:94}],tg);ctx.shadowBlur=0;
// legs running
let swing=Math.sin(world*22)*8;ctx.strokeStyle='#081a45';ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(-12+swing,35);ctx.lineTo(-20+swing,43);ctx.moveTo(7,8);ctx.lineTo(12-swing,30);ctx.lineTo(20-swing,40);ctx.stroke();ctx.strokeStyle='#28dfff';ctx.lineWidth=3;ctx.stroke();
// body hoodie
let body=ctx.createLinearGradient(-20,-20,25,25);body.addColorStop(0,'#202e68');body.addColorStop(.5,'#080f2c');body.addColorStop(1,'#1166bb');ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-19,-28,38,43,11);ctx.fill();ctx.strokeStyle='#1be4ff';ctx.lineWidth=2;ctx.stroke();
// head/hood
ctx.fillStyle='#080d25';ctx.beginPath();ctx.ellipse(0,-40,25,28,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#20cfff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#d9a47e';ctx.beginPath();ctx.ellipse(0,-39,17,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10152b';ctx.beginPath();ctx.ellipse(0,-52,18,10,0,Math.PI,Math.PI*2);ctx.fill();glowCircle(-7,-40,2.5,'#fff',5);glowCircle(7,-40,2.5,'#fff',5);ctx.fillStyle='#28e9ff';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.fillText('S',0,-10);ctx.restore();}
function update(dt){if(!run||paused)return;world+=dt*speed;score+=dt*12;speed=Math.min(.62,.32+score/9000);targetLane=Math.max(-1,Math.min(1,targetLane));lane+=(targetLane-lane)*Math.min(1,dt*12);if(playerY>0||vy>0){playerY+=vy*dt;vy-=3.8*dt;if(playerY<0){playerY=0;vy=0}}spawn+=dt;if(spawn>.48/speed){spawn=0;spawnItem()}for(let it of items){it.z-=dt*speed*.65;it.rot+=dt*4;if(it.z<.08&&!it.done){it.done=true;if(it.lane===Math.round(lane)&&it.kind==='coin'){coins++;score+=35;let p=project(it.lane*.5,it.z);burst(p.x,p.y,'#ffd34f',12);showToast('+1 S-COIN')}else if(it.lane===Math.round(lane)&&it.kind==='block'&&playerY<.5){run=false;paused=false;$('pause').classList.add('hide');$('over').classList.remove('hide');$('result').textContent=`SCORE ${Math.floor(score).toLocaleString()} · COINS ${coins}`;best=Math.max(best,Math.floor(score));localStorage.setItem('sinaps3d_best',best);$('bottom').textContent=`BEST SCORE ${best.toLocaleString()}`}}}items=items.filter(i=>i.z>-.12);$('score').textContent=Math.floor(score).toLocaleString();$('coins').textContent=coins.toLocaleString()}
function draw(dt){background(dt);track();items.sort((a,b)=>b.z-a.z);for(let it of items){let p=project(it.lane*.5,it.z);if(it.kind==='coin'){let r=(7+(1-it.z)*18)*p.scale*1.5;coin(p.x,p.y-8*p.scale,r,it.rot)}else obstacle(it,p)}player();particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.max);glowCircle(p.x,p.y,p.size,p.color,10)});ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);if(shake>0)shake-=dt}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);function start(){score=0;coins=0;lane=0;targetLane=0;playerY=0;vy=0;world=0;speed=.32;spawn=0;items=[];particles=[];run=true;paused=false;$('menu').classList.add('hide');$('over').classList.add('hide');$('pause').classList.remove('hide');$('bottom').textContent='SWIPE TO DODGE · COLLECT THE S-COINS'}$('start').onclick=start;$('again').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('bottom').textContent=paused?'PAUSED':'SWIPE TO DODGE · COLLECT THE S-COINS'};function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),550)}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});addEventListener('touchend',e=>{if(!run||paused)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>18)targetLane=Math.min(1,targetLane+1);else if(dx< -18)targetLane=Math.max(-1,targetLane-1)}else if(dy< -18&&playerY===0)vy=2.05},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')targetLane=Math.max(-1,targetLane-1);if(e.key==='ArrowRight'||e.key==='d')targetLane=Math.min(1,targetLane+1);if((e.key==='ArrowUp'||e.key===' ')&&playerY===0)vy=2.05;if(e.key==='Escape'){$('pause').click()}});})();
</script></body></html>
